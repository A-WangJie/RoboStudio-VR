[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robodata-rd"
version = "0.3.9"
description = "Quest controller telemetry and DK/RoboStudio teleoperation integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets==15.0.1"]

[project.optional-dependencies]
hardware = ["numpy>=1.24,<3"]

[tool.setuptools]
packages = ["bridge"]
py-modules = ["bridge_service", "hardware_control"]
include-package-data = true

[tool.setuptools.package-data]
bridge = ["index.html"]
