<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">RoboStudio-VR</title>
<desc id="desc">A playful VR robot reaches out with a segmented arm to catch a golden cube. Flat blue-gray and gold illustration with bold outlines.</desc>
<defs><clipPath id="frame"><rect x="8" y="8" width="1584" height="484" rx="40"/></clipPath></defs>
<g clip-path="url(#frame)">
 <rect x="8" y="8" width="1584" height="484" fill="#9eafb9"/>
 <!-- One big movement, instead of a collection of engineering icons. -->
 <path d="M1300-65C1535-45 1666 180 1649 531H1241C1416 327 1467 112 1300-65Z" fill="#263d49"/>
 <path d="M1092-17C900-17 839 152 895 295c49 126 246 185 395 91 120-76 150-259 49-358" fill="#e8b82f" stroke="#172b35" stroke-width="6"/>
 <ellipse cx="1152" cy="183" rx="153" ry="151" transform="rotate(-18 1152 183)" fill="#f7f7ee" stroke="#172b35" stroke-width="6"/>
 <!-- Wordmark: oversized, spare, and legible at README width. -->
 <text x="86" y="214" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="113" font-weight="800" letter-spacing="-5">RoboStudio</text>
 <text x="94" y="306" fill="#263d49" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="800" letter-spacing="4">VR</text>
 <path d="M222 283h270" stroke="#263d49" stroke-width="6" stroke-linecap="round"/>
 <text x="94" y="398" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" letter-spacing="1">MOVE. TEACH. CREATE.</text>
 <!-- The cube is the shared target of the robot and its operator. -->
 <g transform="translate(1152 163) rotate(-16)" stroke="#172b35" stroke-width="5" stroke-linejoin="round">
  <path d="M-38-23 3-42 44-20 2 0Z" fill="#ffe47b"/>
  <path d="M-38-23 2 0v46l-40-24Z" fill="#e8b82f"/>
  <path d="M2 0 44-20v43L2 46Z" fill="#d49b16"/>
 </g>
 <g fill="none" stroke="#172b35" stroke-width="6" stroke-linecap="round">
  <path d="m1126 90-6-18m57 10 8-17m37 38 15-8"/>
 </g>
 <!-- Springy segmented arm curling into the center. -->
 <path d="M1393 458C1258 477 1177 433 1090 361 1045 324 1027 283 1057 243" fill="none" stroke="#172b35" stroke-width="59" stroke-linecap="round"/>
 <path d="M1393 458C1258 477 1177 433 1090 361 1045 324 1027 283 1057 243" fill="none" stroke="#fffdf5" stroke-width="43" stroke-linecap="round" stroke-dasharray="23 23"/>
 <!-- Open gripper, leaning toward the floating cube. -->
 <g transform="translate(1053 244) rotate(-31)" stroke="#172b35" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <rect x="-24" y="5" width="47" height="35" rx="14" fill="#e8b82f"/>
  <path d="M-20 8-32-12l5-32 15-4 4 25 12 11 12-11 4-25 15 4 5 32L19 8Z" fill="#fffdf5"/>
  <path d="M-11 15h22" fill="none"/>
 </g>
 <!-- Original mascot: a friendly robot, not the reference's panda character. -->
 <g transform="translate(1424 362) rotate(18)" stroke="#172b35" stroke-width="6" stroke-linejoin="round">
  <path d="M-87 91-16 57l79 14 47 85H-94Z" fill="#e8b82f"/>
  <path d="M-74 87-44 113l24-26m47 5 25 24 25-20" fill="none"/>
  <rect x="-130" y="-55" width="32" height="63" rx="13" fill="#e8b82f"/>
  <rect x="101" y="-55" width="32" height="63" rx="13" fill="#e8b82f"/>
  <rect x="-111" y="-108" width="222" height="194" rx="52" fill="#fffdf5"/>
  <!-- Headset pushed up like a visor so the expressive face stays visible. -->
  <path d="M-94-93q92-29 188 0l-5 53q-42 17-88 9-52 9-91-9Z" fill="#344f5e"/>
  <path d="M-65-78q57-15 113-5" fill="none" stroke="#a9c0ca" stroke-width="9" stroke-linecap="round"/>
  <circle cx="74" cy="-66" r="7" fill="#e8b82f" stroke="none"/>
  <ellipse cx="-45" cy="4" rx="17" ry="25" fill="#172b35" stroke="none"/>
  <ellipse cx="47" cy="4" rx="17" ry="25" fill="#172b35" stroke="none"/>
  <ellipse cx="-50" cy="-5" rx="6" ry="8" fill="#fff" stroke="none"/>
  <ellipse cx="42" cy="-5" rx="6" ry="8" fill="#fff" stroke="none"/>
  <path d="M-13 33q14 22 28 0" fill="none" stroke-linecap="round"/>
  <path d="M-80 33h17m126 0h17" stroke="#d4a332" stroke-width="7" stroke-linecap="round"/>
 </g>
 <!-- Small off-axis controller and motion ticks make the composition lively. -->
 <g transform="translate(1484 104) rotate(29)" stroke="#172b35" stroke-width="6">
  <ellipse cy="-9" rx="26" ry="32" fill="none" stroke="#fffdf5" stroke-width="13"/>
  <path d="M-15-9q15-10 30 0L12 46q-12 13-24 0Z" fill="#fffdf5" stroke-linejoin="round"/>
  <ellipse cy="-7" rx="16" ry="10" fill="#e8b82f"/>
 </g>
 <path d="m1509 41 13-17m8 39 22-5" fill="none" stroke="#fffdf5" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
