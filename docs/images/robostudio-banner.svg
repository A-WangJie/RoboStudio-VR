<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
<title id="title">RoboStudio-VR</title><desc id="desc">RS-inspired engineering banner: silver robotic arm connected to a VR headset. Simulation, teleoperation and data collection.</desc>
